<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Germany Geography Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">GERMANY • LEVEL 1</p>
        <h1>Find the Bundesländer</h1>
      </div>

      <button id="newGame">New game</button>
    </header>

    <section class="hud">
      <div>
        <span>Find</span>
        <strong id="target">—</strong>
      </div>

      <div>
        <span>Score</span>
        <strong id="score">0 / 16</strong>
      </div>

      <div>
        <span>Time</span>
        <strong id="time">02:00</strong>
      </div>
    </section>

    <section class="game">

      <div class="map-card">
        <svg
          id="map"
          viewBox="0 0 600 760"
          aria-label="Map of Germany">
        </svg>

        <p class="hint">
          Click the state you think is correct.
        </p>
      </div>

      <aside>
        <h2>How to play</h2>

        <p>
          Find all 16 German federal states.
        </p>

        <div id="message" class="message">
          Good luck!
        </div>

        <button id="next" class="next" disabled>
          Next
        </button>
      </aside>

    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
