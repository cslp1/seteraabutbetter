<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seterra But Better</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

  <header>
    <div>
      <p class="eyebrow">GERMANY • GEOGRAPHY GAME</p>
      <h1>Seterra But Better</h1>
    </div>

    <button id="newGame">New Game</button>
  </header>


  <!-- LEVEL SELECTOR -->

  <nav class="levels">

    <button
      class="level active"
      data-level="states"
    >
      Level 1
      <small>Bundesländer</small>
    </button>

    <button
      class="level"
      data-level="districts"
    >
      Level 2
      <small>Regierungsbezirke</small>
    </button>

  </nav>


  <section class="hud">

    <div class="stat">
      <span>Find</span>
      <strong id="target">Loading...</strong>
    </div>

    <div class="stat">
      <span>Score</span>
      <strong id="score">0 / 0</strong>
    </div>

    <div class="stat">
      <span>Time</span>
      <strong id="time">02:00</strong>
    </div>

  </section>


  <section class="game">

    <div class="map-card">

      <svg
        id="map"
        viewBox="0 0 800 800"
        preserveAspectRatio="xMidYMid meet"
      ></svg>

      <p class="hint">
        Click the region you are looking for.
      </p>

    </div>


    <aside>

      <h2 id="levelTitle">
        Bundesländer
      </h2>

      <p>
        Find every region on the map.
      </p>

      <div
        id="message"
        class="message"
      >
        Loading map...
      </div>

      <button
        id="next"
        class="next"
        disabled
      >
        Next
      </button>

    </aside>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<script src="game.js"></script>

</body>
</html>
